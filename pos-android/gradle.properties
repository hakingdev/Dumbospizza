# JVM для сборки. Xmx хватает и на AGP, и на Kotlin-компилятор;
# кодировку фиксируем, чтобы русские строки в исходниках не поехали.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# JDK для сборки — JDK 17 (AGP 8.6.1 и Kotlin 1.9.25 новее 21 не поддерживают).
# Путь к нему МАШИННЫЙ и живёт в ~/.gradle/gradle.properties (org.gradle.java.home),
# а не здесь: этот файл общий для мака и кассового ПК.

org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
