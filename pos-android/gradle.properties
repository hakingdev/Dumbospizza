# jdk.net.unixdomain.tmpdir — обязателен в этом окружении.
#
# JDK 17 создаёт внутренние пайпы (java.nio.channels.Pipe, а через них любой
# Selector) поверх Unix-domain сокета, файл которого кладёт в java.io.tmpdir.
# Здесь в этом каталоге создать AF_UNIX-сокет нельзя, и Gradle падает ещё до
# конфигурации: «java.io.IOException: Unable to establish loopback connection».
# TCP-loopback при этом исправен — блокированы именно unix-сокеты, поэтому
# смена селектора (WindowsSelectorProvider) не помогает: Pipe.open() падает и с ним.
#
# Лаунчеру Gradle тот же ключ нужен через GRADLE_OPTS — он открывает Selector
# раньше, чем читает этот файл.
org.gradle.jvmargs=-Djdk.net.unixdomain.tmpdir=C\:\\Temp -Xmx2048m -Dfile.encoding=UTF-8

org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
